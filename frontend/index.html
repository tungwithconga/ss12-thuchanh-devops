<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>TaskFlow</title>
    <style>
        body {
            font-family: system-ui;
            background: #f2f5fa;
            margin: 0;
            padding: 30px;
            color: #1b2940;
        }

        .wrap {
            max-width: 650px;
            margin: 40px auto;
            background: white;
            padding: 30px;
            border-radius: 18px;
            box-shadow: 0 12px 40px #1232;
        }

        h1 {
            margin-top: 0;
        }

        .add {
            display: flex;
            gap: 10px;
        }

        input[type="text"] {
            flex: 1;
            padding: 12px;
            border: 1px solid #ccd3de;
            border-radius: 8px;
            min-width: 0;
        }

        button {
            border: 0;
            border-radius: 8px;
            background: #285ce6;
            color: white;
            padding: 11px 16px;
            cursor: pointer;
        }

        li {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 14px 0;
            border-bottom: 1px solid #eee;
        }

        li span {
            flex: 1;
            overflow-wrap: anywhere;
        }

        .done {
            text-decoration: line-through;
            color: #888;
        }

        .delete {
            background: #d34b4b;
        }

        #error {
            color: #c22;
        }
    </style>
</head>

<body>
<main class="wrap">
    <h1>TaskFlow</h1>
    <p>Quản lý công việc cá nhân</p>

    <form id="form" class="add">
        <input
                id="title"
                type="text"
                maxlength="255"
                placeholder="Nhập công việc..."
                required
        />
        <button type="submit">Thêm</button>
    </form>

    <p id="error" role="alert"></p>
    <ul id="list" style="list-style: none; padding: 0"></ul>
</main>

<script>
    const list = document.querySelector("#list");
    const error = document.querySelector("#error");

    async function request(path, options = {}) {
        const response = await fetch("/api/tasks" + path, {
            ...options,
            headers: {
                "Content-Type": "application/json",
                ...(options.headers || {})
            }
        });

        if (!response.ok) {
            throw new Error("API lỗi: " + response.status);
        }

        return response.status === 204 ? null : response.json();
    }

    async function load() {
        try {
            error.textContent = "";
            const tasks = await request("");

            list.replaceChildren();

            for (const task of tasks) {
                const li = document.createElement("li");
                const check = document.createElement("input");
                const span = document.createElement("span");
                const del = document.createElement("button");

                check.type = "checkbox";
                check.checked = task.completed;

                span.textContent = task.title;
                if (task.completed) {
                    span.className = "done";
                }

                del.textContent = "Xóa";
                del.className = "delete";

                check.onchange = async () => {
                    try {
                        await request("/" + task.id, {
                            method: "PUT",
                            body: JSON.stringify({
                                title: task.title,
                                completed: check.checked
                            })
                        });
                        await load();
                    } catch (e) {
                        error.textContent = e.message;
                    }
                };

                del.onclick = async () => {
                    try {
                        await request("/" + task.id, {
                            method: "DELETE"
                        });
                        await load();
                    } catch (e) {
                        error.textContent = e.message;
                    }
                };

                li.append(check, span, del);
                list.append(li);
            }
        } catch (e) {
            error.textContent = e.message;
        }
    }

    document.querySelector("#form").onsubmit = async function (e) {
        e.preventDefault();

        const titleInput = document.querySelector("#title");
        const title = titleInput.value.trim();

        if (!title) {
            error.textContent = "Vui lòng nhập công việc";
            return;
        }

        try {
            await request("", {
                method: "POST",
                body: JSON.stringify({
                    title,
                    completed: false
                })
            });

            titleInput.value = "";
            await load();
        } catch (e) {
            error.textContent = e.message;
        }
    };

    load();
</script>
</body>
</html>
